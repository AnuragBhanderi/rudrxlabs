<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Rudrx Labs is a new home for practical software, experiments, and ideas."
    />
    <meta name="theme-color" content="#080b0f" />
    <title>Rudrx Labs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header" aria-label="Rudrx Labs">
        <a class="brand" href="/" aria-label="Rudrx Labs home">
          <span class="brand-mark" aria-hidden="true"><span>R</span></span>
          <span>Rudrx Labs</span>
        </a>
        <span class="status"><span aria-hidden="true"></span> In development</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <p class="eyebrow">Independent digital lab</p>
          <h1 id="hero-title">Ideas become<br /><em>useful things.</em></h1>
          <p class="intro">
            A new home for practical software, experiments, and ideas.
            We&rsquo;re building quietly&mdash;more will appear here soon.
          </p>
        </section>

        <aside class="signal-card" aria-label="Current status">
          <div class="signal-visual" aria-hidden="true">
            <span class="orbit orbit-one"></span>
            <span class="orbit orbit-two"></span>
            <span class="core">R</span>
          </div>
          <div class="signal-copy">
            <span>Current signal</span>
            <strong>Something new is taking shape.</strong>
          </div>
        </aside>
      </main>

      <footer>
        <span>&copy; 2026 Rudrx Labs</span>
        <span>Built with intent.</span>
      </footer>
    </div>
  </body>
</html>
