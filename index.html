<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RudrX Labs is a home for useful software, focused experiments, and what comes next." />
    <meta name="theme-color" content="#ffffff" />
    <title>RudrX Labs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="RudrX Labs home">
          <span class="logo-window">
            <img src="assets/rudrx-labs-logo.png" alt="RudrX Labs" width="2000" height="2000" />
          </span>
        </a>
        <div class="status" aria-label="Website status">
          <span class="status-dot" aria-hidden="true"></span>
          Coming soon
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <p class="eyebrow"><span>01</span> Independent digital lab</p>
          <h1 id="hero-title">Small ideas.<br /><em>Built with intent.</em></h1>
          <p class="intro">
            RudrX Labs is a home for useful software, focused experiments,
            and whatever comes next.
          </p>
        </section>

        <aside class="lab-panel" aria-label="RudrX Labs is in development">
          <div class="panel-top"><span>R / X</span><span>2026</span></div>
          <div class="x-mark" aria-hidden="true">X</div>
          <div class="panel-bottom">
            <span>Current phase</span>
            <strong>Building the foundation.</strong>
          </div>
        </aside>
      </main>

      <footer>
        <span>&copy; 2026 RudrX Labs.</span>
        <span>More soon.</span>
      </footer>
    </div>
  </body>
</html>
